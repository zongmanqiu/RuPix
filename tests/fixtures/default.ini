# 老配置兼容样例（tests/fixtures/default.ini，受 tests/config_compat.rs 门禁）。
# 前半：现行全键的非默认取值——解析器必须逐键生效。
# 后半：旧版已淘汰键（bird_eye 等）——必须静默忽略，绝不 panic、绝不污染其他键。

stay_on_top=1
double_click=3
show_title_bar=0
long_image_fit=1
wheel_behavior=1
init_window=1
window_w=1024
window_h=768
opacity=40
legacy_disabled=av;raw
prefetch=0
close_to_tray=1
raw_last=1920x1080:8

# 旧版设置项（已淘汰，读到只当未知键忽略）
cache_age=0
cache_limit=0
protected=1
bird_eye=1
light_checker=0
keep_transform=1
close_anim=0
